name: vanrozgar_app
description: "VanRozgar 2.0 - AI-Powered Village Livelihood Intelligence Platform (From Forest Rights to Sustainable Livelihoods)"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  google_fonts: ^9.0.0
  intl: ^0.20.3
  flutter_svg: ^2.0.9
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
